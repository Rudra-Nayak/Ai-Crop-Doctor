<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Crop Doctor — Smart Crop Diagnosis</title>
    <meta name="description" content="Upload a crop photo, describe symptoms, or speak to the AI Crop Doctor for instant plant disease diagnosis powered by agricultural knowledge.">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gurmukhi:wght@400;500;600&family=Noto+Sans+Oriya:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════════ TOP NAV BAR ═══════════════ -->
    <nav class="top-nav" id="topNav">
        <div class="nav-inner">
            <div class="nav-brand">
                <div class="brand-icon">
                    <i class="bi bi-flower1"></i>
                </div>
                <div class="brand-text">
                    <h1>AI Crop Doctor</h1>
                    <span class="nav-status" id="navStatus">
                        <span class="status-dot"></span>
                        <span id="statusText">Ready</span>
                    </span>
                </div>
            </div>
            <div class="nav-actions">
                <div class="lang-selector" id="langSelector">
                    <button class="lang-btn" id="langBtn" aria-label="Select language" title="Select language">
                        <i class="bi bi-translate"></i>
                        <span id="langLabel">EN</span>
                        <i class="bi bi-chevron-down lang-chevron"></i>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <button class="lang-option active" data-lang="en" data-label="EN">
                            <span class="lang-name">English</span>
                            <i class="bi bi-check2 lang-check"></i>
                        </button>
                        <button class="lang-option" data-lang="hi" data-label="हिं">
                            <span class="lang-name">हिन्दी</span>
                            <i class="bi bi-check2 lang-check"></i>
                        </button>
                        <button class="lang-option" data-lang="or" data-label="ଓ">
                            <span class="lang-name">ଓଡ଼ିଆ</span>
                            <i class="bi bi-check2 lang-check"></i>
                        </button>
                        <button class="lang-option" data-lang="pa" data-label="ਪੰ">
                            <span class="lang-name">ਪੰਜਾਬੀ</span>
                            <i class="bi bi-check2 lang-check"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ═══════════════ MAIN CHAT AREA ═══════════════ -->
    <main class="chat-main" id="chatMain">
        <div class="chat-container" id="chatContainer">

            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <div class="welcome-icon-ring">
                        <div class="welcome-icon">
                            <i class="bi bi-flower2"></i>
                        </div>
                    </div>
                    <h2 class="welcome-title" data-i18n="welcome_title">AI Crop Doctor</h2>
                    <p class="welcome-subtitle" data-i18n="welcome_subtitle">Upload a crop photo, describe the problem, or speak to the Crop Doctor.</p>

                    <div class="welcome-capabilities">
                        <div class="capability">
                            <div class="cap-icon"><i class="bi bi-camera"></i></div>
                            <span data-i18n="cap_photo">Crop photo analysis</span>
                        </div>
                        <div class="capability">
                            <div class="cap-icon"><i class="bi bi-chat-text"></i></div>
                            <span data-i18n="cap_text">Symptom description</span>
                        </div>
                        <div class="capability">
                            <div class="cap-icon"><i class="bi bi-mic"></i></div>
                            <span data-i18n="cap_voice">Voice diagnosis</span>
                        </div>
                    </div>

                    <div class="welcome-suggestions" id="welcomeSuggestions">
                        <p class="suggestion-label" data-i18n="try_asking">Try asking:</p>
                        <button class="suggestion-chip" data-text="Why are my tomato leaves turning brown?">
                            <i class="bi bi-arrow-right-circle"></i>
                            <span>Why are my tomato leaves turning brown?</span>
                        </button>
                        <button class="suggestion-chip" data-text="My rice leaves have spots.">
                            <i class="bi bi-arrow-right-circle"></i>
                            <span>My rice leaves have spots.</span>
                        </button>
                        <button class="suggestion-chip" data-text="Check this crop for disease.">
                            <i class="bi bi-arrow-right-circle"></i>
                            <span>Check this crop for disease.</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat Messages Container -->
            <div class="messages-list" id="messagesList">
                <!-- Messages are inserted here by JS -->
            </div>
        </div>
    </main>

    <!-- ═══════════════ BOTTOM COMPOSER ═══════════════ -->
    <footer class="composer-footer" id="composerFooter">
        <!-- Image Preview Bar -->
        <div class="image-preview-bar" id="imagePreviewBar">
            <div class="image-preview-inner">
                <img id="imagePreviewImg" src="" alt="Selected crop image preview">
                <button class="image-remove-btn" id="imageRemoveBtn" aria-label="Remove image" title="Remove selected image">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>

        <!-- Recording Indicator -->
        <div class="recording-bar" id="recordingBar">
            <div class="recording-inner">
                <div class="rec-pulse"></div>
                <span class="rec-label" data-i18n="recording">Recording...</span>
                <span class="rec-timer" id="recTimer">0:00</span>
                <button class="rec-cancel-btn" id="recCancelBtn" aria-label="Cancel recording" title="Cancel recording">
                    <i class="bi bi-x-lg"></i>
                </button>
                <button class="rec-stop-btn" id="recStopBtn" aria-label="Stop recording and use" title="Stop recording">
                    <i class="bi bi-stop-fill"></i>
                </button>
            </div>
        </div>

        <!-- Composer Input Row -->
        <div class="composer-row">
            <!-- Image Upload -->
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/bmp" capture="environment" class="d-none" aria-label="Upload crop image">
            <button class="composer-btn attach-btn" id="attachBtn" aria-label="Attach crop image" title="Upload or capture crop image">
                <i class="bi bi-plus-lg"></i>
            </button>

            <!-- Text Input -->
            <div class="composer-input-wrap">
                <textarea
                    id="messageInput"
                    class="composer-input"
                    placeholder="Type your crop problem..."
                    data-i18n-placeholder="input_placeholder"
                    rows="1"
                    aria-label="Type your crop symptoms or question"
                ></textarea>
            </div>

            <!-- Voice Button -->
            <button class="composer-btn mic-btn" id="micBtn" aria-label="Record voice message" title="Record voice message">
                <i class="bi bi-mic"></i>
            </button>

            <!-- Send Button -->
            <button class="composer-btn send-btn" id="sendBtn" aria-label="Send message" title="Send diagnosis request" disabled>
                <i class="bi bi-arrow-up"></i>
            </button>
        </div>
    </footer>

    <!-- ═══════════════ MESSAGE TEMPLATES (hidden) ═══════════════ -->
    <!-- User Message Template -->
    <template id="tmplUserMsg">
        <div class="msg msg-user">
            <div class="msg-bubble msg-bubble-user">
                <div class="msg-user-image" data-slot="userImage"></div>
                <div class="msg-text" data-slot="userText"></div>
                <div class="msg-voice-badge" data-slot="voiceBadge">
                    <i class="bi bi-mic-fill"></i> <span data-i18n="voice_input">Voice input</span>
                </div>
            </div>
        </div>
    </template>

    <!-- AI Message Template -->
    <template id="tmplAiMsg">
        <div class="msg msg-ai">
            <div class="msg-avatar">
                <i class="bi bi-flower1"></i>
            </div>
            <div class="msg-bubble msg-bubble-ai" data-slot="aiContent">
                <!-- Content injected by JS -->
            </div>
        </div>
    </template>

    <!-- Loading Indicator Template -->
    <template id="tmplLoading">
        <div class="msg msg-ai msg-loading" id="loadingMsg">
            <div class="msg-avatar">
                <i class="bi bi-flower1"></i>
            </div>
            <div class="msg-bubble msg-bubble-ai">
                <div class="loading-dots">
                    <div class="loading-text" id="loadingText">Analyzing your crop...</div>
                    <div class="dot-container">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
