<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Crop Doctor — Smart Crop Diagnosis</title>
    <meta name="description" content="Upload a crop photo, describe symptoms, or speak to the AI Crop Doctor for instant plant disease diagnosis powered by agricultural knowledge.">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gurmukhi:wght@400;500;600&family=Noto+Sans+Oriya:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Embedded Core CSS (Zero Network Delay / Works Offline) -->
    <style>
    :root {
        --brand-50:  #f0fdf4;
        --brand-100: #dcfce7;
        --brand-200: #bbf7d0;
        --brand-300: #86efac;
        --brand-400: #4ade80;
        --brand-500: #22c55e;
        --brand-600: #16a34a;
        --brand-700: #15803d;
        --brand-800: #166534;
        --brand-900: #14532d;
        --neutral-0:   #ffffff;
        --neutral-50:  #f8fafc;
        --neutral-100: #f1f5f9;
        --neutral-200: #e2e8f0;
        --neutral-300: #cbd5e1;
        --neutral-400: #94a3b8;
        --neutral-500: #64748b;
        --neutral-600: #475569;
        --neutral-700: #334155;
        --neutral-800: #1e293b;
        --neutral-900: #0f172a;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger:  #ef4444;
        --info:    #3b82f6;
        --conf-high:   #22c55e;
        --conf-medium: #f59e0b;
        --conf-low:    #ef4444;
        --surface-bg:       #f0f4f0;
        --surface-card:     #ffffff;
        --surface-user-msg: #16a34a;
        --surface-ai-msg:   #ffffff;
        --font-primary: 'Inter', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', 'Noto Sans Oriya', system-ui, -apple-system, sans-serif;
        --nav-height:      56px;
        --max-chat-width:  780px;
        --radius-sm:  8px;
        --radius-md:  12px;
        --radius-lg:  20px;
        --radius-full: 9999px;
        --shadow-sm:  0 1px 2px rgba(0,0,0,0.05);
        --shadow-md:  0 4px 12px rgba(0,0,0,0.08);
        --shadow-lg:  0 8px 30px rgba(0,0,0,0.12);
        --shadow-glow: 0 0 20px rgba(34,197,94,0.15);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --transition-fast: 150ms var(--ease-out);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: var(--font-primary); font-size: 15px; line-height: 1.55;
        color: var(--neutral-800); background: var(--surface-bg);
        overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    .top-nav {
        position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height);
        background: rgba(255,255,255,0.92); backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--neutral-200); z-index: 100;
    }
    .nav-inner {
        max-width: 960px; margin: 0 auto; height: 100%;
        display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
        width: 36px; height: 36px; border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 18px; flex-shrink: 0; box-shadow: var(--shadow-glow);
    }
    .brand-text h1 {
        font-size: 17px; font-weight: 700; margin: 0; color: var(--neutral-900); letter-spacing: -0.3px;
    }
    .nav-status {
        display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--neutral-500); font-weight: 500;
    }
    .status-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--brand-500);
        display: inline-block; animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Language Selector */
    .lang-selector { position: relative; }
    .lang-btn {
        display: flex; align-items: center; gap: 6px; padding: 6px 12px;
        border: 1px solid var(--neutral-200); border-radius: var(--radius-full);
        background: var(--neutral-0); color: var(--neutral-700); font-size: 13px; font-weight: 600;
        cursor: pointer; transition: all var(--transition-fast); font-family: var(--font-primary);
    }
    .lang-btn:hover { border-color: var(--brand-400); background: var(--brand-50); }
    .lang-chevron { font-size: 10px; transition: transform var(--transition-fast); }
    .lang-selector.open .lang-chevron { transform: rotate(180deg); }
    .lang-dropdown {
        position: absolute; top: calc(100% + 6px); right: 0; min-width: 160px;
        background: var(--neutral-0); border: 1px solid var(--neutral-200); border-radius: var(--radius-md);
        box-shadow: var(--shadow-lg); padding: 4px; display: none; z-index: 200;
    }
    .lang-selector.open .lang-dropdown { display: block; }
    .lang-option {
        display: flex; align-items: center; justify-content: space-between; width: 100%;
        padding: 8px 12px; border: none; border-radius: var(--radius-sm); background: transparent;
        color: var(--neutral-700); font-size: 14px; font-family: var(--font-primary);
        cursor: pointer; transition: background var(--transition-fast);
    }
    .lang-option:hover { background: var(--brand-50); }
    .lang-option .lang-check { opacity: 0; color: var(--brand-600); font-size: 16px; }
    .lang-option.active .lang-check { opacity: 1; }
    .lang-option.active { color: var(--brand-700); font-weight: 600; }

    /* Chat Main */
    .chat-main {
        position: fixed; top: var(--nav-height); left: 0; right: 0; bottom: 0;
        overflow: hidden; display: flex; flex-direction: column;
    }
    .chat-container {
        flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
    }
    .messages-list {
        max-width: var(--max-chat-width); margin: 0 auto; padding: 16px 16px 140px 16px; display: none;
    }
    .messages-list.active { display: flex; flex-direction: column; gap: 16px; }

    /* Welcome Screen */
    .welcome-screen {
        max-width: var(--max-chat-width); margin: 0 auto; padding: 40px 24px 140px 24px;
        display: flex; align-items: center; justify-content: center; min-height: 100%;
    }
    .welcome-screen.hidden { display: none !important; }
    .welcome-content { text-align: center; max-width: 480px; }
    .welcome-icon-ring {
        width: 88px; height: 88px; margin: 0 auto 24px; border-radius: 50%;
        background: linear-gradient(135deg, var(--brand-100), var(--brand-200));
        display: flex; align-items: center; justify-content: center; position: relative;
    }
    .welcome-icon {
        width: 64px; height: 64px; border-radius: 50%;
        background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 28px; box-shadow: var(--shadow-glow);
    }
    .welcome-title { font-size: 26px; font-weight: 700; color: var(--neutral-900); margin: 0 0 8px; letter-spacing: -0.5px; }
    .welcome-subtitle { font-size: 15px; color: var(--neutral-500); margin: 0 0 32px; line-height: 1.6; }
    .welcome-capabilities { display: flex; justify-content: center; gap: 24px; margin-bottom: 36px; flex-wrap: wrap; }
    .capability { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cap-icon {
        width: 48px; height: 48px; border-radius: var(--radius-md);
        background: var(--brand-50); border: 1px solid var(--brand-200);
        display: flex; align-items: center; justify-content: center; font-size: 20px;
        color: var(--brand-600); transition: all var(--transition-fast);
    }
    .capability span { font-size: 12px; font-weight: 500; color: var(--neutral-600); }
    .suggestion-label { font-size: 12px; font-weight: 600; color: var(--neutral-400); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
    .suggestion-chip {
        display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; margin-bottom: 8px;
        border: 1px solid var(--neutral-200); border-radius: var(--radius-md); background: var(--neutral-0);
        color: var(--neutral-700); font-size: 14px; font-family: var(--font-primary); text-align: left;
        cursor: pointer; transition: all var(--transition-fast);
    }
    .suggestion-chip:hover { border-color: var(--brand-300); background: var(--brand-50); transform: translateX(4px); }
    .suggestion-chip i { color: var(--brand-500); font-size: 16px; flex-shrink: 0; }

    /* Messages */
    .msg { display: flex; gap: 10px; animation: msg-in 300ms var(--ease-out); }
    @keyframes msg-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .msg-user { justify-content: flex-end; }
    .msg-bubble { max-width: 85%; border-radius: var(--radius-lg); overflow: hidden; }
    .msg-bubble-user {
        background: var(--surface-user-msg); color: white; padding: 12px 16px; border-bottom-right-radius: 6px;
    }
    .msg-bubble-user .msg-text { font-size: 14.5px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
    .msg-user-image { display: none; }
    .msg-user-image.has-image { display: block; margin-bottom: 8px; }
    .msg-user-image img { max-width: 240px; max-height: 200px; border-radius: var(--radius-md); object-fit: cover; }
    .msg-voice-badge { display: none; align-items: center; gap: 4px; font-size: 11px; opacity: 0.7; margin-top: 6px; }
    .msg-voice-badge.visible { display: flex; }
    .msg-ai { justify-content: flex-start; }
    .msg-avatar {
        width: 32px; height: 32px; border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 14px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-bubble-ai {
        background: var(--surface-ai-msg); color: var(--neutral-800); padding: 14px 18px;
        border: 1px solid var(--neutral-200); border-bottom-left-radius: 6px; box-shadow: var(--shadow-sm);
    }
    .ai-response-text { font-size: 14.5px; line-height: 1.65; word-break: break-word; white-space: pre-wrap; }
    .tts-play-btn {
        display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 5px 12px;
        border: 1px solid var(--neutral-200); border-radius: var(--radius-full); background: var(--neutral-50);
        color: var(--neutral-600); font-size: 12px; font-family: var(--font-primary); cursor: pointer; transition: all var(--transition-fast);
    }
    .tts-play-btn:hover { background: var(--brand-50); border-color: var(--brand-300); color: var(--brand-700); }

    /* Diagnosis Card */
    .diagnosis-card {
        margin-top: 12px; border: 1px solid var(--neutral-200); border-radius: var(--radius-md);
        overflow: hidden; background: var(--neutral-0);
    }
    .diag-header {
        display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
        background: var(--brand-50); border-bottom: 1px solid var(--brand-200); gap: 8px; flex-wrap: wrap;
    }
    .diag-header-left { display: flex; flex-direction: column; gap: 2px; }
    .diag-plant { font-size: 13px; font-weight: 600; color: var(--brand-700); }
    .diag-disease { font-size: 16px; font-weight: 700; color: var(--neutral-900); }
    .diag-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .diag-badge {
        display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-full);
        font-size: 12px; font-weight: 600;
    }
    .diag-badge-confidence { background: var(--brand-100); color: var(--brand-800); }
    .diag-badge-confidence.medium { background: #fef3c7; color: #92400e; }
    .diag-badge-confidence.low { background: #fee2e2; color: #991b1b; }
    .diag-badge-severity { background: var(--neutral-100); color: var(--neutral-700); }
    .diag-badge-severity.severe, .diag-badge-severity.critical { background: #fee2e2; color: #991b1b; }
    .diag-badge-severity.moderate { background: #fef3c7; color: #92400e; }
    .confidence-bar-wrap { padding: 8px 16px; border-bottom: 1px solid var(--neutral-100); }
    .confidence-bar-label {
        display: flex; justify-content: space-between; font-size: 11px; font-weight: 600;
        color: var(--neutral-500); margin-bottom: 4px; text-transform: uppercase;
    }
    .confidence-bar { height: 6px; background: var(--neutral-200); border-radius: 3px; overflow: hidden; }
    .confidence-fill { height: 100%; border-radius: 3px; background: var(--conf-high); transition: width 800ms var(--ease-out); }
    .confidence-fill.medium { background: var(--conf-medium); }
    .confidence-fill.low { background: var(--conf-low); }
    .diag-section { padding: 12px 16px; border-bottom: 1px solid var(--neutral-100); }
    .diag-section:last-child { border-bottom: none; }
    .diag-section-title {
        font-size: 11px; font-weight: 700; color: var(--neutral-400); text-transform: uppercase;
        letter-spacing: 0.8px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    }
    .diag-section-title i { font-size: 13px; color: var(--brand-500); }
    .diag-list { list-style: none; padding: 0; margin: 0; }
    .diag-list li {
        font-size: 13.5px; line-height: 1.6; color: var(--neutral-700); padding: 2px 0 2px 16px; position: relative;
    }
    .diag-list li::before {
        content: ''; position: absolute; left: 0; top: 10px; width: 5px; height: 5px;
        border-radius: 50%; background: var(--brand-400);
    }
    .diag-cause { font-size: 13.5px; color: var(--neutral-700); line-height: 1.6; }
    .evidence-list li::before { background: var(--info); }
    .evidence-list li { color: var(--neutral-600); font-size: 12.5px; }
    .healthy-card {
        margin-top: 12px; padding: 20px; border: 1px solid var(--brand-200); border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--brand-50), var(--neutral-0)); text-align: center;
    }
    .healthy-icon { font-size: 40px; color: var(--brand-500); margin-bottom: 8px; }
    .healthy-title { font-size: 16px; font-weight: 700; color: var(--brand-700); margin-bottom: 4px; }
    .healthy-text { font-size: 13.5px; color: var(--neutral-600); }
    .followup-card {
        margin-top: 12px; padding: 16px; border: 1px solid var(--warning); border-left: 4px solid var(--warning);
        border-radius: var(--radius-md); background: #fffbeb;
    }
    .followup-title { font-size: 13px; font-weight: 700; color: #92400e; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .followup-question { font-size: 14px; color: var(--neutral-700); line-height: 1.6; }
    .error-card {
        margin-top: 12px; padding: 16px; border: 1px solid var(--danger); border-left: 4px solid var(--danger);
        border-radius: var(--radius-md); background: #fef2f2;
    }
    .error-title { font-size: 13px; font-weight: 700; color: #991b1b; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .error-text { font-size: 13.5px; color: var(--neutral-700); }

    /* Loading */
    .loading-dots { display: flex; align-items: center; gap: 10px; }
    .loading-text { font-size: 13.5px; color: var(--neutral-500); font-style: italic; }
    .dot-container { display: flex; gap: 4px; }
    .dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--brand-400);
        animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.16s; }
    .dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes dot-bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* Bottom Composer */
    .composer-footer {
        position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--neutral-200); z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .composer-row {
        max-width: var(--max-chat-width); margin: 0 auto; display: flex;
        align-items: flex-end; gap: 6px; padding: 10px 12px;
    }
    .composer-btn {
        width: 42px; height: 42px; border: none; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 18px;
        cursor: pointer; flex-shrink: 0; transition: all var(--transition-fast);
    }
    .attach-btn { background: var(--neutral-100); color: var(--neutral-600); }
    .attach-btn:hover { background: var(--brand-100); color: var(--brand-700); }
    .attach-btn.has-image { background: var(--brand-500); color: white; }
    .composer-input-wrap { flex: 1; min-width: 0; }
    .composer-input {
        width: 100%; padding: 10px 14px; border: 1px solid var(--neutral-200);
        border-radius: var(--radius-lg); background: var(--neutral-0); color: var(--neutral-800);
        font-size: 15px; font-family: var(--font-primary); line-height: 1.4; resize: none;
        overflow: hidden; outline: none; transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        max-height: 120px;
    }
    .composer-input:focus { border-color: var(--brand-400); box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
    .composer-input::placeholder { color: var(--neutral-400); }
    .mic-btn { background: var(--neutral-100); color: var(--neutral-600); }
    .mic-btn:hover { background: var(--brand-100); color: var(--brand-700); }
    .mic-btn.recording { background: var(--danger); color: white; animation: mic-pulse 1.2s ease-in-out infinite; }
    @keyframes mic-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
    .send-btn { background: var(--brand-500); color: white; opacity: 0.4; pointer-events: none; transition: all var(--transition-fast); }
    .send-btn.active { opacity: 1; pointer-events: auto; }
    .send-btn.active:hover { background: var(--brand-600); transform: scale(1.05); }

    /* Image Preview Bar */
    .image-preview-bar { display: none; max-width: var(--max-chat-width); margin: 0 auto; padding: 8px 12px 0; }
    .image-preview-bar.visible { display: block; }
    .image-preview-inner { display: inline-flex; position: relative; border-radius: var(--radius-md); overflow: hidden; border: 2px solid var(--brand-300); }
    .image-preview-inner img { height: 72px; max-width: 120px; object-fit: cover; display: block; }
    .image-remove-btn {
        position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
        border: none; background: rgba(0,0,0,0.6); color: white; font-size: 10px;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* Recording Bar */
    .recording-bar { display: none; max-width: var(--max-chat-width); margin: 0 auto; padding: 8px 12px 0; }
    .recording-bar.visible { display: block; }
    .recording-inner {
        display: flex; align-items: center; gap: 10px; padding: 8px 14px;
        background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-md);
    }
    .rec-pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: rec-pulse-anim 1s ease-in-out infinite; }
    @keyframes rec-pulse-anim { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } }
    .rec-label { font-size: 13px; font-weight: 600; color: #991b1b; }
    .rec-timer { font-size: 13px; font-weight: 600; color: var(--neutral-600); font-variant-numeric: tabular-nums; margin-left: auto; }
    .rec-cancel-btn, .rec-stop-btn {
        width: 30px; height: 30px; border: none; border-radius: 50%; display: flex;
        align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
    }
    .rec-cancel-btn { background: var(--neutral-200); color: var(--neutral-600); }
    .rec-stop-btn { background: var(--danger); color: white; }

    /* Responsive */
    @media (max-width: 640px) {
        .composer-row { padding: 8px 8px; gap: 4px; }
        .composer-btn { width: 38px; height: 38px; font-size: 16px; }
        .composer-input { font-size: 16px; padding: 9px 12px; }
    }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav" id="topNav">
        <div class="nav-inner">
            <div class="nav-brand">
                <div class="brand-icon">
                    <i class="bi bi-flower1">&#127793;</i>
                </div>
                <div class="brand-text">
                    <h1>AI Crop Doctor</h1>
                    <span class="nav-status" id="navStatus">
                        <span class="status-dot"></span>
                        <span id="statusText">Ready</span>
                    </span>
                </div>
            </div>
            <div class="nav-actions">
                <div class="lang-selector" id="langSelector">
                    <button class="lang-btn" id="langBtn" aria-label="Select language" title="Select language">
                        <i class="bi bi-translate">&#127760;</i>
                        <span id="langLabel">EN</span>
                        <i class="bi bi-chevron-down lang-chevron">&#9662;</i>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <button class="lang-option active" data-lang="en" data-label="EN">
                            <span class="lang-name">English</span>
                            <span class="lang-check">&#10003;</span>
                        </button>
                        <button class="lang-option" data-lang="hi" data-label="हिं">
                            <span class="lang-name">हिन्दी</span>
                            <span class="lang-check">&#10003;</span>
                        </button>
                        <button class="lang-option" data-lang="or" data-label="ଓ">
                            <span class="lang-name">ଓଡ଼ିଆ</span>
                            <span class="lang-check">&#10003;</span>
                        </button>
                        <button class="lang-option" data-lang="pa" data-label="ਪੰ">
                            <span class="lang-name">ਪੰਜਾਬੀ</span>
                            <span class="lang-check">&#10003;</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Chat Area -->
    <main class="chat-main" id="chatMain">
        <div class="chat-container" id="chatContainer">

            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <div class="welcome-icon-ring">
                        <div class="welcome-icon">
                            <span>&#127793;</span>
                        </div>
                    </div>
                    <h2 class="welcome-title" data-i18n="welcome_title">AI Crop Doctor</h2>
                    <p class="welcome-subtitle" data-i18n="welcome_subtitle">Upload a crop photo, describe the problem, or speak to the Crop Doctor.</p>

                    <div class="welcome-capabilities">
                        <div class="capability">
                            <div class="cap-icon"><span>&#128247;</span></div>
                            <span data-i18n="cap_photo">Crop photo analysis</span>
                        </div>
                        <div class="capability">
                            <div class="cap-icon"><span>&#128172;</span></div>
                            <span data-i18n="cap_text">Symptom description</span>
                        </div>
                        <div class="capability">
                            <div class="cap-icon"><span>&#127908;</span></div>
                            <span data-i18n="cap_voice">Voice diagnosis</span>
                        </div>
                    </div>

                    <div class="welcome-suggestions" id="welcomeSuggestions">
                        <p class="suggestion-label" data-i18n="try_asking">Try asking:</p>
                        <button class="suggestion-chip" data-text="Why are my tomato leaves turning brown?">
                            <span>&#10132;</span>
                            <span>Why are my tomato leaves turning brown?</span>
                        </button>
                        <button class="suggestion-chip" data-text="My rice leaves have spots.">
                            <span>&#10132;</span>
                            <span>My rice leaves have spots.</span>
                        </button>
                        <button class="suggestion-chip" data-text="Check this crop for disease.">
                            <span>&#10132;</span>
                            <span>Check this crop for disease.</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Messages List -->
            <div class="messages-list" id="messagesList">
                <!-- Messages appended here by app.js -->
            </div>
        </div>
    </main>

    <!-- Bottom Composer -->
    <footer class="composer-footer" id="composerFooter">
        <!-- Image Preview Bar -->
        <div class="image-preview-bar" id="imagePreviewBar">
            <div class="image-preview-inner">
                <img id="imagePreviewImg" src="" alt="Selected crop image preview">
                <button class="image-remove-btn" id="imageRemoveBtn" aria-label="Remove image" title="Remove selected image">
                    &#10005;
                </button>
            </div>
        </div>

        <!-- Recording Indicator Bar -->
        <div class="recording-bar" id="recordingBar">
            <div class="recording-inner">
                <div class="rec-pulse"></div>
                <span class="rec-label" data-i18n="recording">Recording...</span>
                <span class="rec-timer" id="recTimer">0:00</span>
                <button class="rec-cancel-btn" id="recCancelBtn" aria-label="Cancel recording" title="Cancel recording">
                    &#10005;
                </button>
                <button class="rec-stop-btn" id="recStopBtn" aria-label="Stop recording and use" title="Stop recording">
                    &#9632;
                </button>
            </div>
        </div>

        <!-- Composer Row -->
        <div class="composer-row">
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/bmp" capture="environment" class="d-none" aria-label="Upload crop image">
            <button class="composer-btn attach-btn" id="attachBtn" aria-label="Attach crop image" title="Upload crop photo">
                <i class="bi bi-plus-lg">+</i>
            </button>

            <div class="composer-input-wrap">
                <textarea
                    id="messageInput"
                    class="composer-input"
                    placeholder="Type your crop problem..."
                    data-i18n-placeholder="input_placeholder"
                    rows="1"
                    aria-label="Type your crop symptoms or question"
                ></textarea>
            </div>

            <button class="composer-btn mic-btn" id="micBtn" aria-label="Record voice message" title="Record voice message">
                <i class="bi bi-mic">&#127908;</i>
            </button>

            <button class="composer-btn send-btn" id="sendBtn" aria-label="Send message" title="Send diagnosis request" disabled>
                <i class="bi bi-arrow-up">&#10148;</i>
            </button>
        </div>
    </footer>

    <!-- Message Templates -->
    <template id="tmplUserMsg">
        <div class="msg msg-user">
            <div class="msg-bubble msg-bubble-user">
                <div class="msg-user-image" data-slot="userImage"></div>
                <div class="msg-text" data-slot="userText"></div>
                <div class="msg-voice-badge" data-slot="voiceBadge">
                    <span>&#127908;</span> <span data-i18n="voice_input">Voice message</span>
                </div>
            </div>
        </div>
    </template>

    <template id="tmplAiMsg">
        <div class="msg msg-ai">
            <div class="msg-avatar">
                <span>&#127793;</span>
            </div>
            <div class="msg-bubble msg-bubble-ai" data-slot="aiContent">
            </div>
        </div>
    </template>

    <template id="tmplLoading">
        <div class="msg msg-ai msg-loading" id="loadingMsg">
            <div class="msg-avatar">
                <span>&#127793;</span>
            </div>
            <div class="msg-bubble msg-bubble-ai">
                <div class="loading-dots">
                    <div class="loading-text" id="loadingText">Analyzing your crop...</div>
                    <div class="dot-container">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
